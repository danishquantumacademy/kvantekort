name: Check sources

# Checks that the pages listed in data/sources.csv can be read anonymously (no login, no cookies)
# and commits the result to data/sources_check.csv.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/sources.csv]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_sources_public.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources_check.csv
          git diff --cached --quiet || git commit -m "Source access check [skip ci]"
          git pull --rebase && git push
