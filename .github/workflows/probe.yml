name: probe reachability
on:
  push:
    branches: [probe-reach]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p s
          i=0
          while read u; do
            i=$((i+1))
            curl -s -L --max-time 40 -A 'Mozilla/5.0 (compatible; DQA-map/1.0; +https://map.danishquantumacademy.dk)' -o "s/$i.html" "$u"
            echo "$i $(stat -c %s s/$i.html 2>/dev/null) $u" | tee -a s/index.txt
          done < probe-urls.txt
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add s && git commit -m "samples [skip ci]" && git push
