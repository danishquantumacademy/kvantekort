name: Collect research output harvest

# Commits the result files of an earlier "Harvest research output" run (by run id).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the harvest run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Commit
        run: |
          mkdir -p data/people/research_outputs
          # each artifact holds the whole folder; take only the university's own file from it
          for d in dl/out-*; do i=$(basename "$d"); i=${i#out-}; i=$(echo "$i" | tr 'A-Z' 'a-z'); cp "$d/$i.tsv" data/people/research_outputs/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/research_outputs
          git diff --cached --quiet || git commit -m "Research output harvest [skip ci]"
          git push
