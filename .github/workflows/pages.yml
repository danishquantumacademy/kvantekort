name: Byg og publicér Kvantekort

on:
  push:
    branches: [main]
    paths: ["data/**", "site/*template.html", "scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # mandag 05:17 UTC: nyheder, events og stillinger for forskningsgrupperne

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent gruppernes nyheder, events og stillinger samt offentlige kvantearrangementer
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install --quiet beautifulsoup4 lxml
          python scripts/fetch_group_feeds.py || echo "feed fetch failed; keeping last data"
          python scripts/fetch_outreach.py || echo "outreach fetch failed; keeping last data"
          python scripts/fetch_jobs.py || echo "job fetch failed; keeping last data"
          if ! git diff --quiet -- data/groups/feeds.json data/outreach data/industry/jobs.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard data/groups/feeds.json data/outreach data/industry/jobs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/groups/feeds.json data/outreach data/industry/jobs.json
            git commit -m "Weekly update of research group news, events and positions [skip ci]"
            git push
          fi
      - run: python scripts/build_site.py
      # Password protection: when the repository secret SITE_PASSWORD is set, every page except the front page is encrypted
      # (StatiCrypt, AES-256) and asks for the password; the raw data file is left out of the published site.
      - name: Password protection
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        if: env.SITE_PASSWORD != ''
        run: |
          # A pasted secret often ends with a space or line break; strip it so the typed password matches.
          PW="$(printf '%s' "$SITE_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "Password length after trimming: ${#PW} (before: ${#SITE_PASSWORD})"
          rm -f site/data.json site/*artifact*.html
          # The front page (index.html) is public; every other page asks for the password.
          npx --yes staticrypt@3 $(ls site/*.html | grep -v '^site/index\.html$') -d site -p "$PW" --short --remember 30 \
            --template-title "Danish Quantum Academy" \
            --template-instructions "This map is not public yet. Enter the password to open it." \
            --template-button "Open" --template-placeholder "Password" \
            --template-color-primary "#1f45c9" --template-color-secondary "#f6f7fa"
          # "Remember me" is ticked by default, so the password is asked once and not again on every page.
          sed -i 's/id="staticrypt-remember" type="checkbox"/& checked/' site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
