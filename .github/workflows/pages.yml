name: Byg og publicér Kvantekort

on:
  push:
    branches: [main]
    paths: ["data/**", "site/*template.html", "scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # mandag 05:17 UTC: nyheder, events og stillinger for forskningsgrupperne

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent gruppernes nyheder, events og stillinger
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install --quiet beautifulsoup4 lxml
          python scripts/fetch_group_feeds.py || echo "feed fetch failed; keeping last data"
          if ! git diff --quiet -- data/groups/feeds.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard data/groups/feeds.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/groups/feeds.json
            git commit -m "Weekly update of research group news, events and positions [skip ci]"
            git push
          fi
      - run: python scripts/build_site.py
      # Password protection: when the repository secret SITE_PASSWORD is set, every page is encrypted
      # (StatiCrypt, AES-256) and asks for the password; the raw data file is left out of the published site.
      - name: Password protection
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        if: env.SITE_PASSWORD != ''
        run: |
          rm -f site/data.json site/*artifact*.html
          npx --yes staticrypt@3.5.4 site/*.html -d site -p "$SITE_PASSWORD" --short --remember 30 \
            --template-title "Danish Quantum Academy" \
            --template-instructions "This map is not public yet. Enter the password to open it." \
            --template-button "Open" --template-placeholder "Password" \
            --template-color-primary "#1f45c9" --template-color-secondary "#f6f7fa"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
