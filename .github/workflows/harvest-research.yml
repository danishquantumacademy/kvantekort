name: Harvest research output

# Reads research output (2021 onwards) and supervised PhD theses of every educator from the public research portals
# and commits data/people/research_outputs/*.tsv. Started by hand.
on:
  workflow_dispatch:
    inputs:
      inst:
        description: "Universities (space separated)"
        default: "DTU KU AU SDU AAU"
      limit:
        description: "Only the first N educators per university (test); 0 = all"
        default: "0"
      debug:
        description: "Print every listing page"
        default: ""
      only_missing:
        description: "Only re-read OpenAlex for educators without an author record (keeps the rest)"
        default: ""

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        inst: [DTU, KU, AU, SDU, AAU]
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.inputs.inst, matrix.inst)
      - uses: actions/setup-python@v5
        if: contains(github.event.inputs.inst, matrix.inst)
        with:
          python-version: "3.12"
      - name: Install browser
        if: contains(github.event.inputs.inst, matrix.inst)
        run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Harvest
        if: contains(github.event.inputs.inst, matrix.inst)
        run: python scripts/harvest_research.py ${{ matrix.inst }}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          DEBUG: ${{ github.event.inputs.debug }}
          ONLY_MISSING: ${{ github.event.inputs.only_missing }}
      - uses: actions/upload-artifact@v4
        if: contains(github.event.inputs.inst, matrix.inst)
        with:
          name: out-${{ matrix.inst }}
          path: data/people/research_outputs/

  commit:
    needs: harvest
    if: always() && github.event.inputs.limit == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Commit
        run: |
          git pull --ff-only origin main
          mkdir -p data/people/research_outputs
          # each artifact holds the whole folder; take only the university's own file from it
          for d in dl/out-*; do i=$(basename "$d"); i=${i#out-}; i=$(echo "$i" | tr 'A-Z' 'a-z'); cp "$d/$i.tsv" data/people/research_outputs/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/research_outputs
          git diff --cached --quiet || git commit -m "Research output harvest [skip ci]"
          git push
